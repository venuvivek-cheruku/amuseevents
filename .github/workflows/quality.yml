name: Quality

on:
  push:
  pull_request:

jobs:
  build:
    name: Style rules and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check style rules
        run: npm run check:style-rules

      - name: Build
        run: npm run build
